<!DOCTYPE html>
<html>

<head>

    <title>Guess The City</title>

    <style>

        body{
            text-align:center;
            font-family:Arial;
        }

        img{
            width:800px;
            max-width:90%;
        }

        input{
            padding:10px;
            font-size:16px;
        }

        button{
            padding:10px 20px;
            font-size:16px;
            margin-top:10px;
        }

    </style>

</head>

<body>

<h1>Guess The City</h1>

<img src="{{ url_for('static',
filename='images/' + image) }}">

<br><br>

<form action="/check" method="POST">

    <input
            type="text"
            name="guess"
            placeholder="Enter city name"
            required>

    <button type="submit">
        Submit
    </button>

</form>

{% if result %}

<h2>{{ result }}</h2>

<a href="/next">

    <button>
        Next Question
    </button>

</a>

{% endif %}

</body>

</html>
