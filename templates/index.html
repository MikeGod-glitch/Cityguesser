<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <title>Guess The City</title>

    <style>

        body{
            text-align:center;
            font-family:Arial;
        }

        img{
            width:800px;
            max-width:90%;
            max-height:60vh;
            object-fit:contain;
        }

        input{
            padding:10px;
            font-size:16px;
        }

        button{
            padding:10px 20px;
            font-size:16px;
            margin-top:10px;
        }

    </style>

</head>

<body>

<h1>Guess The City</h1>

<img src="{{ image_url }}" alt="Guess the city" onerror="this.onerror=null;this.src='{{ fallback_url }}'">
{% if source_url %}
<p><small>Photo: {{ credit[0] }} · {{ credit[1] }} · <a href="{{ source_url }}" target="_blank" rel="noopener noreferrer">Source and license</a></small></p>
{% endif %}

<br><br>

<form action="/check" method="POST">

    <input
            type="text"
            name="guess"
            placeholder="Enter city name"
            required>

    <button type="submit">
        Submit
    </button>

</form>

{% if result %}

<h2>{{ result }}</h2>

<a href="/next">

    <button>
        Next Question
    </button>

</a>

{% endif %}

</body>

</html>
