<div class="sound-controls" data-sound-controls hidden>
    <button class="game-mode-button sound-toggle" type="button" data-sound-toggle aria-label="Mute sound effects" aria-pressed="false" hidden>
        <span data-sound-label>Sound on</span>
    </button>
    <label class="sound-volume">
        <span class="sr-only">Sound effects volume</span>
        <input type="range" min="0" max="100" step="1" value="30" data-sound-volume aria-valuetext="30%">
        <output data-sound-volume-value>30%</output>
    </label>
</div>
